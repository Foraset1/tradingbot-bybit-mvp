name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest
      - run: docker build --tag tradingbot-ci .
      - run: >-
          docker run --rm --entrypoint python tradingbot-ci -c
          "import lightgbm, pyarrow, sklearn;
          print(lightgbm.__version__, pyarrow.__version__, sklearn.__version__)"
