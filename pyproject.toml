[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot-bybit"
version = "0.12.0"
description = "Read-only Bybit market-data collector and research foundation for a local trading model"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TradingBot project" }]
dependencies = [
    "websockets>=14.2,<16",
]

[project.optional-dependencies]
dataset = [
    "pyarrow==25.0.0",
]
research = [
    "joblib==1.5.3",
    "lightgbm==4.7.0",
    "narwhals==2.24.0",
    "numpy==2.5.1",
    "pyarrow==25.0.0",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "threadpoolctl==3.6.0",
]
dev = [
    "joblib==1.5.3",
    "lightgbm==4.7.0",
    "mypy>=1.14,<2",
    "narwhals==2.24.0",
    "numpy==2.5.1",
    "pyarrow==25.0.0",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    "threadpoolctl==3.6.0",
]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradingbot = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tradingbot"]
