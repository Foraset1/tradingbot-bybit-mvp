[bybit]
public_ws_url = "wss://stream.bybit.com/v5/public/linear"
symbols = [
    "BTCUSDT",
    "ETHUSDT",
    "SOLUSDT",
    "XRPUSDT",
    "BNBUSDT",
    "LINKUSDT",
]
heartbeat_seconds = 20
stale_connection_seconds = 60.0
reconnect_min_seconds = 1.0
reconnect_max_seconds = 30.0

[market]
orderbook_depth = 50
orderbook_snapshot_ms = 1000
ticker_snapshot_ms = 1000
kline_intervals = ["1", "5", "15"]
collect_orderbook = true
collect_trades = true
collect_tickers = true
collect_klines = true

[storage]
root = "data/raw"
segment_seconds = 300
segment_max_bytes = 134217728
flush_seconds = 1.0
queue_maxsize = 100000
min_free_bytes = 16106127360
health_path = "runtime/collector-health.json"

[archive]
# Keep raw JSONL only as a short replay/debug window.  Daily verified Parquet is
# retained separately and is normally about one tenth of the raw size.
raw_retention_days = 7
daily_minimum_duration_seconds = 82800.0

[history]
# Official Bybit daily public-trade archives are streamed into compact 1-second
# and 1-minute trade bars. Compressed CSV files and individual ticks are not kept.
root = "data/history"
public_base_url = "https://public.bybit.com/trading"
# Offline archives do not contain our receive timestamp. This conservative delay
# defines when a derived bar is considered available to the research pipeline.
assumed_latency_ms = 1000
request_timeout_seconds = 60
download_attempts = 3
# Do not manufacture candles for minutes with no public trades. Sparse minutes
# remain explicit gaps. This v1-compatible key limits the longest consecutive
# trade-free run, not the total number of sparse minutes in the UTC day.
maximum_missing_minutes = 5

[risk]
# These values are documented now and will only be used by a later trading service.
max_notional_fraction = 0.05
target_risk_fraction = 0.005
max_planned_risk_fraction = 0.007
rolling_24h_loss_fraction = 0.01
max_open_positions = 1
max_hold_seconds = 3600
soft_exit_seconds = 3300
forced_exit_seconds = 3540
entry_order_ttl_seconds = 45

[evaluation]
# Research-only assumptions. Replace fee values with the account's actual tier before
# interpreting any cost-aware report. `run-backtest` does not model maker fills;
# `run-execution-backtest` applies the separate public-data V3 fill proxy.
horizon_minutes = 60
embargo_minutes = 60
minimum_train_days = 30
test_days = 14
maximum_folds = 4
acceptance_minimum_days = 365
minimum_train_rows = 1000
minimum_test_rows = 250
# A strictly older, purged window is reserved for probability calibration.
calibration_days = 7
minimum_calibration_rows = 250
# Incomplete price-history symbols are excluded before any model is fitted.
minimum_symbol_coverage_fraction = 0.95
maker_fee_bps = 2.0
taker_fee_bps = 5.5
entry_adverse_selection_bps = 1.0
stop_slippage_bps = 3.0
timeout_slippage_bps = 1.0
minimum_expected_net_bps = 1.0
lightgbm_estimators = 300
lightgbm_learning_rate = 0.03
lightgbm_num_leaves = 31
lightgbm_min_child_samples = 100
# Logistic regression remains a baseline, but its deterministic, time-uniform fit
# sample is bounded so a 365-day evaluation fits on the 8-GiB research server.
logistic_max_training_rows = 500000
# Leave two CPUs free for the collector and the host on the current 4-CPU server.
training_threads = 2
random_seed = 20260730
